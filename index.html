<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" controls>
        <source src="aphex-track.mp3" type="audio/mpeg">
    </audio>
    <div id="info">Click to start</div>
    <script>
        const info = document.getElementById('info');
        const audio = document.getElementById('bgMusic');
        info.addEventListener('click', () => {
            console.log('Clicked! Playing audio...');
            audio.play().then(() => console.log('Audio playing')).catch(e => console.error('Audio error:', e));
            info.style.display = 'none';
        });
    </script>
</body>
</html>
